[workspace]
resolver = "3"
members = ["crates/*"]

# Do not change a workspace lint without saying why in that same change.
[workspace.lints.rust]
missing_docs = "warn"
unused_results = "warn"
unsafe_code = "forbid"
ambiguous_negative_literals = "deny"
let_underscore_drop = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
# All output goes through one output module, so --json stdout carries only JSON (anc.dev P2).
# That module writes through stdout/stderr handles, which these lints don't flag.
print_stdout = "deny"
print_stderr = "deny"

# Every dependency is declared here once (08 build DAG, T0) so later tasks never edit this file.
[workspace.dependencies]
annotate-snippets = "0.12.17"
anstream = "1.0.0"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
globset = "0.4.21"
ignore = "0.4.34"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
strsim = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-md = { version = "0.5.4", features = ["parser"] }
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
# Dev only. Schemas are validated locally, so the HTTP resolver is left out.
insta = "1.49.0"
jsonschema = { version = "0.60.2", default-features = false }
tempfile = "3.27.0"
