name: Release

# Build, checksum, attest and draft the release assets for the six Unix targets.
# Pull requests that touch this file, Cargo.lock or the toolchain pin run the build and
# checksum jobs only, with read-only permissions. Attestation and the draft release run
# only for a `v*` tag push or a `workflow_dispatch` with a `tag` input.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and draft, for example v0.4.0"
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "rust-toolchain*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXPECTED_ARCHIVES: "6"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      # rust-toolchain.toml says `stable`; this makes the pinned version win for every cargo and rustc call.
      RUSTUP_TOOLCHAIN: "1.99.1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, musl: false }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, musl: false }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, musl: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, musl: true }
          - { target: aarch64-apple-darwin, runner: macos-15, musl: false }
          - { target: x86_64-apple-darwin, runner: macos-15-intel, musl: false }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Install musl-tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          USE_MUSL: ${{ matrix.musl }}
        run: |
          set -euo pipefail
          if [ "$USE_MUSL" = "true" ]; then
            triple_env="${TARGET//-/_}"
            export "CC_${triple_env}=musl-gcc"
            linker_env="CARGO_TARGET_$(echo "$triple_env" | tr '[:lower:]' '[:upper:]')_LINKER"
            export "${linker_env}=musl-gcc"
          fi
          rustc -vV
          SUPDOC_RELEASE_BINARY=1 cargo build --release --locked --target "$TARGET"
      - name: Check the musl binary is statically linked
        if: matrix.musl
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          out="$(file "target/${TARGET}/release/supdoc")"
          echo "$out"
          if ! echo "$out" | grep -qE 'statically linked|static-pie linked'; then
            echo "musl binary is not statically linked" >&2
            exit 1
          fi
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "supdoc"))')"
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
            if [ "$tag" != "v$version" ]; then
              echo "tag $tag does not match crate version $version" >&2
              exit 1
            fi
          fi
          name="supdoc-${version}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/supdoc" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          tar -tzf "dist/${name}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true
      - name: Count archives and write SHA256SUMS
        run: |
          set -euo pipefail
          cd archives
          count="$(find . -maxdepth 1 -name 'supdoc-*.tar.gz' | wc -l | tr -d ' ')"
          if [ "$count" != "$EXPECTED_ARCHIVES" ]; then
            echo "expected $EXPECTED_ARCHIVES archives, found $count" >&2
            ls -l
            exit 1
          fi
          sha256sum supdoc-*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            archives/*.tar.gz
            archives/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attest and draft release
    if: github.event_name != 'pull_request'
    needs: checksums
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      INPUT_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - name: Check the asset set
        run: |
          set -euo pipefail
          cd assets
          count="$(find . -maxdepth 1 -name 'supdoc-*.tar.gz' | wc -l | tr -d ' ')"
          if [ "$count" != "$EXPECTED_ARCHIVES" ]; then
            echo "expected $EXPECTED_ARCHIVES archives, found $count" >&2
            exit 1
          fi
          lines="$(wc -l < SHA256SUMS | tr -d ' ')"
          if [ "$lines" != "$EXPECTED_ARCHIVES" ]; then
            echo "expected $EXPECTED_ARCHIVES SHA256SUMS lines, found $lines" >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/supdoc-*.tar.gz
      - name: Draft the release
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "release $tag is already published; refusing to replace its assets" >&2
              exit 1
            fi
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber assets/supdoc-*.tar.gz assets/SHA256SUMS
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "supdoc $tag" --notes "" assets/supdoc-*.tar.gz assets/SHA256SUMS
          fi
