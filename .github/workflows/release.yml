name: Release

# Build, checksum, attest and draft the release assets for the eight targets.
# Pull requests that touch this file, Cargo.lock or the toolchain pin run the build and
# checksum jobs only, with read-only permissions. Attestation and the draft release run
# only for a `v*` tag push or a `workflow_dispatch` with a `tag` input.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and draft, for example v0.4.0"
        required: true
        type: string
  release:
    types: [published]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "rust-toolchain*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'release' && github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXPECTED_ARCHIVES: "8"

jobs:
  build:
    name: build ${{ matrix.target }}
    if: github.event_name != 'release'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      # rust-toolchain.toml says `stable`; this makes the pinned version win for every cargo and rustc call.
      RUSTUP_TOOLCHAIN: "1.99.1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, musl: false }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, musl: false }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, musl: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, musl: true }
          - { target: aarch64-apple-darwin, runner: macos-15, musl: false }
          - { target: x86_64-apple-darwin, runner: macos-15-intel, musl: false }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, musl: false }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, musl: false }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Install musl-tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      # ring needs clang on PATH to build for Windows arm64. Use whichever install the runner image has:
      # the Visual Studio 2022 or 2026 LLVM component, then a standalone LLVM. Fail if none is present.
      - name: Put an installed clang on PATH for ring (arm64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in \
            "/c/Program Files/Microsoft Visual Studio/2022"/*/VC/Tools/Llvm/ARM64/bin \
            "/c/Program Files/Microsoft Visual Studio/2026"/*/VC/Tools/Llvm/ARM64/bin \
            "/c/Program Files/Microsoft Visual Studio/18"/*/VC/Tools/Llvm/ARM64/bin \
            "/c/Program Files/LLVM/bin"; do
            if [ -x "$dir/clang.exe" ]; then
              cygpath -w "$dir" >> "$GITHUB_PATH"
              echo "using clang from $dir"
              exit 0
            fi
          done
          echo "no clang.exe found for ring on windows-11-arm" >&2
          exit 1
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          USE_MUSL: ${{ matrix.musl }}
          # Windows binaries link the C runtime statically so they start without the VC++ redistributable.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: |
          set -euo pipefail
          if [ "$USE_MUSL" = "true" ]; then
            triple_env="${TARGET//-/_}"
            export "CC_${triple_env}=musl-gcc"
            linker_env="CARGO_TARGET_$(echo "$triple_env" | tr '[:lower:]' '[:upper:]')_LINKER"
            export "${linker_env}=musl-gcc"
          fi
          rustc -vV
          SUPDOC_RELEASE_BINARY=1 cargo build --release --locked --target "$TARGET"
      - name: Check the musl binary is statically linked
        if: matrix.musl
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          out="$(file "target/${TARGET}/release/supdoc")"
          echo "$out"
          if ! echo "$out" | grep -qE 'statically linked|static-pie linked'; then
            echo "musl binary is not statically linked" >&2
            exit 1
          fi
      - name: Check the Windows binary imports no C runtime DLL
        if: contains(matrix.target, 'windows')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          readobj=""
          host=x64
          case "$TARGET" in aarch64-*) host=ARM64 ;; esac
          for dir in \
            "/c/Program Files/Microsoft Visual Studio/2022"/*/VC/Tools/Llvm/$host/bin \
            "/c/Program Files/Microsoft Visual Studio/2026"/*/VC/Tools/Llvm/$host/bin \
            "/c/Program Files/Microsoft Visual Studio/18"/*/VC/Tools/Llvm/$host/bin \
            "/c/Program Files/LLVM/bin"; do
            if [ -x "$dir/llvm-readobj.exe" ]; then readobj="$dir/llvm-readobj.exe"; break; fi
          done
          if [ -z "$readobj" ]; then
            echo "no llvm-readobj.exe found to read the import table" >&2
            exit 1
          fi
          imports="$("$readobj" --coff-imports "target/${TARGET}/release/supdoc.exe" | grep -E '^ *Name:' || true)"
          echo "imports of supdoc.exe:"
          echo "$imports"
          if [ -z "$imports" ]; then
            echo "read no imports from supdoc.exe; the check cannot be trusted" >&2
            exit 1
          fi
          if echo "$imports" | grep -iE 'vcruntime|ucrtbase|api-ms-win-crt'; then
            echo "supdoc.exe imports the C runtime dynamically" >&2
            exit 1
          fi
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "supdoc"))')"
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
            if [ "$tag" != "v$version" ]; then
              echo "tag $tag does not match crate version $version" >&2
              exit 1
            fi
          fi
          name="supdoc-${version}-${TARGET}"
          mkdir -p "dist/$name"
          bin=supdoc
          case "$TARGET" in *-windows-*) bin=supdoc.exe ;; esac
          cp "target/${TARGET}/release/$bin" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          tar -tzf "dist/${name}.tar.gz"
      - name: Smoke the built binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "supdoc"))')"
          bin="$PWD/target/${TARGET}/release/supdoc"
          case "$TARGET" in *-windows-*) bin="$bin.exe" ;; esac
          fixture="$PWD/crates/supdoc/tests/fixtures/basic"
          reported="$("$bin" --version)"
          echo "$reported"
          if [ "$reported" != "supdoc $version" ]; then
            echo "expected 'supdoc $version', got '$reported'" >&2
            exit 1
          fi
          # Copy the fixture outside the checkout so it is its own project, then record its links and check them.
          work="$(mktemp -d "${RUNNER_TEMP}/smoke.XXXXXX")"
          cp -R "$fixture/." "$work/"
          cd "$work"
          "$bin" init
          updated="$("$bin" update --yes 2>&1)"
          echo "$updated"
          recorded="$(echo "$updated" | sed -nE 's/^supdoc\.lock: ([0-9]+) recorded$/\1/p')"
          if [ -z "$recorded" ] || [ "$recorded" -lt 1 ]; then
            echo "update did not record at least one link (got '${recorded:-none}')" >&2
            exit 1
          fi
          out="$("$bin" check)"
          echo "$out"
          if ! echo "$out" | grep -qE "^Links +${recorded} passed\$"; then
            echo "check did not print 'Links ${recorded} passed' to match the ${recorded} recorded links" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: checksums
    if: github.event_name != 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true
      - name: Count archives and write SHA256SUMS
        run: |
          set -euo pipefail
          cd archives
          count="$(find . -maxdepth 1 -name 'supdoc-*.tar.gz' | wc -l | tr -d ' ')"
          if [ "$count" != "$EXPECTED_ARCHIVES" ]; then
            echo "expected $EXPECTED_ARCHIVES archives, found $count" >&2
            ls -l
            exit 1
          fi
          sha256sum supdoc-*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            archives/*.tar.gz
            archives/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attest and draft release
    if: github.event_name != 'pull_request' && github.event_name != 'release'
    needs: checksums
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      INPUT_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - name: Check the asset set
        run: |
          set -euo pipefail
          cd assets
          count="$(find . -maxdepth 1 -name 'supdoc-*.tar.gz' | wc -l | tr -d ' ')"
          if [ "$count" != "$EXPECTED_ARCHIVES" ]; then
            echo "expected $EXPECTED_ARCHIVES archives, found $count" >&2
            exit 1
          fi
          lines="$(wc -l < SHA256SUMS | tr -d ' ')"
          if [ "$lines" != "$EXPECTED_ARCHIVES" ]; then
            echo "expected $EXPECTED_ARCHIVES SHA256SUMS lines, found $lines" >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/supdoc-*.tar.gz
      - name: Draft the release
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$is_draft" = "true" ]; then
              gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber assets/supdoc-*.tar.gz assets/SHA256SUMS
            else
              existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
              for f in assets/supdoc-*.tar.gz assets/SHA256SUMS; do
                name="$(basename "$f")"
                if printf '%s\n' "$existing" | grep -qxF "$name"; then
                  echo "release $tag is already published and already has $name; refusing to replace it" >&2
                  exit 1
                fi
              done
              gh release upload "$tag" --repo "$GITHUB_REPOSITORY" assets/supdoc-*.tar.gz assets/SHA256SUMS
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "supdoc $tag" --notes "" assets/supdoc-*.tar.gz assets/SHA256SUMS
          fi

  npm:
    name: publish to npm
    if: github.event_name == 'release' && !github.event.release.prerelease && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ format('refs/tags/{0}', github.event.release.tag_name) }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install -g npm@11.6.2
          fi
          npm --version
      - name: Publish the npm packages
        run: npm/publish.sh "${TAG#v}" --provenance
