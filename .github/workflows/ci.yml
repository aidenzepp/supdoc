name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install code-block tools
        # Pinned shfmt and ruff binaries, checked against ci/tools.sha256, and black with every
        # dependency hash-pinned in ci/requirements-black.txt. Those files name the sources.
        # shellcheck is pinned the same way, so the runner's own older one is never used.
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/code-block-tools"
          mkdir -p "$tools/download" "$tools/bin"
          cd "$tools/download"
          curl -fsSLO https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          curl -fsSLO https://github.com/astral-sh/ruff/releases/download/0.17.3/ruff-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          grep -v '^#' "$GITHUB_WORKSPACE/ci/tools.sha256" | sha256sum --strict -c -
          install -m 0755 shfmt_v3.14.1_linux_amd64 "$tools/bin/shfmt"
          tar -xzf ruff-x86_64-unknown-linux-gnu.tar.gz
          install -m 0755 ruff-x86_64-unknown-linux-gnu/ruff "$tools/bin/ruff"
          tar -xzf shellcheck-v0.11.0.linux.x86_64.tar.gz
          install -m 0755 shellcheck-v0.11.0/shellcheck "$tools/bin/shellcheck"
          python3 -m venv "$tools/black"
          "$tools/black/bin/python" -m pip install --quiet --disable-pip-version-check \
            --require-hashes --only-binary=:all: -r "$GITHUB_WORKSPACE/ci/requirements-black.txt"
          ln -s "$tools/black/bin/black" "$tools/bin/black"
          echo "$tools/bin" >> "$GITHUB_PATH"
          "$tools/bin/shfmt" --version
          "$tools/bin/ruff" --version
          "$tools/bin/black" --version
          "$tools/bin/shellcheck" --version
      - name: Test
        env:
          # A real-tool test whose tool is missing fails here instead of skipping.
          SUPDOC_REQUIRE_REAL_TOOLS: "1"
        run: cargo test --workspace
      - name: Check supdoc's own docs
        env:
          # supdoc's own repo: CI already runs this PR's code, so trusting its config adds no risk.
          # NEVER add a `pull_request_target` or `workflow_run` trigger to this workflow while
          # SUPDOC_TRUST is set: those run with secrets on untrusted code.
          SUPDOC_TRUST: "1"
        run: |
          set -euo pipefail
          # PATH carries the pinned shellcheck, shfmt, ruff and black from the install step.
          [ "$(command -v shellcheck)" = "$RUNNER_TEMP/code-block-tools/bin/shellcheck" ]
          cargo run --quiet -p supdoc -- check --deny-warnings
      - name: Package
        run: cargo package -p supdoc --locked

  deny:
    name: cargo deny (licenses, bans, sources, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  anc:
    name: anc audit (agent-native CLI standard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install anc
        run: cargo install agentnative --version 0.6.0 --locked
      - name: Build
        run: cargo build --workspace
      - name: Audit
        # anc exits 1 when only SHOULD/MAY audits warn, 2 when a MUST audit fails, and 3 when an
        # audit could not run. Warnings are reported in the log; MUST failures fail the job.
        run: |
          status=0
          anc audit . || status=$?
          if [ "$status" -ge 2 ]; then exit "$status"; fi
